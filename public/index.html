<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resenha</title>
  <meta name="theme-color" content="#1e1f22">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="boot" class="boot">Carregando…</div>

  <!-- ===== Login / cadastro ===== -->
  <main id="auth-screen" class="auth" hidden>
    <div class="auth-card">
      <div class="auth-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
      </div>
      <h1 id="auth-title">Bem-vindo de volta!</h1>
      <p id="auth-sub" class="muted center">Entre para ver suas salas.</p>

      <form id="auth-form" class="form">
        <div id="name-field" class="field" hidden>
          <label for="auth-name">Nome de exibição</label>
          <input id="auth-name" maxlength="32" autocomplete="nickname">
        </div>
        <div id="email-field" class="field">
          <label for="auth-email">E-mail</label>
          <input id="auth-email" type="email" autocomplete="email" required>
        </div>
        <div id="pass-field" class="field">
          <label for="auth-pass">Senha</label>
          <input id="auth-pass" type="password" minlength="6" autocomplete="current-password" required>
        </div>
        <button type="button" id="forgot-link" class="link">Esqueceu a senha?</button>
        <button type="submit" id="auth-submit" class="btn primary block">Entrar</button>
        <p id="auth-msg" class="msg" role="alert"></p>
      </form>

      <div id="oauth-box">
        <div class="divider"><span>ou</span></div>
        <button type="button" id="google-btn" class="btn secondary block">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
          Entrar com Google
        </button>
      </div>
      <p class="switch"><span id="switch-text">Ainda não tem conta?</span> <button type="button" id="switch-btn" class="link">Criar conta</button></p>
      <button type="button" class="btn secondary block install-btn" id="install-auth" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        Instalar o app no PC
      </button>
    </div>
  </main>

  <!-- ===== App ===== -->
  <div id="app" class="app" hidden>
    <nav class="rail" aria-label="Suas salas">
      <div id="rail-rooms" class="rail-rooms"></div>
      <div class="rail-sep"></div>
      <button class="rail-btn green" id="create-room-btn" title="Criar sala" aria-label="Criar sala">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="rail-btn green" id="explore-btn" title="Explorar salas públicas" aria-label="Explorar salas públicas">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3z"/></svg>
      </button>
      <button class="rail-btn green" id="install-rail" title="Instalar o app no PC" aria-label="Instalar o app no PC" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
      </button>
    </nav>

    <aside class="sidebar">
      <header class="side-head">
        <button id="room-menu-btn" class="room-menu-btn" aria-haspopup="menu">
          <span id="room-title">Nenhuma sala</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </header>

      <div class="channels" id="channels">
        <div class="cat">Avisos</div>
        <button class="channel" id="ch-updates">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
          atualizações
          <span class="new-badge" id="updates-badge" hidden>NOVO</span>
        </button>
        <div class="cat">Canais de texto</div>
        <button class="channel" id="ch-chat"><span class="hash">#</span> chat</button>
        <div class="cat">Canais de voz</div>
        <button class="channel" id="ch-call">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
          Call
        </button>
        <ul id="call-list" class="call-list"></ul>
      </div>

      <div id="voice-bar" class="voice-bar" hidden>
        <div class="vb-top">
          <div>
            <div class="vb-title" id="vb-title"><span class="dot"></span> Voz conectada</div>
            <div class="vb-sub" id="vb-sub"></div>
          </div>
          <button class="icon-btn danger" id="hangup-btn" title="Sair da call" aria-label="Sair da call"></button>
        </div>
        <div class="vb-actions">
          <button class="vb-btn" id="cam-btn" aria-label="Câmera"></button>
          <button class="vb-btn" id="screen-btn" aria-label="Transmitir tela"></button>
        </div>
      </div>

      <footer class="user-panel">
        <button class="me" id="me-btn" aria-haspopup="menu">
          <span class="avatar" id="me-avatar"></span>
          <span class="me-text"><span class="me-name" id="me-name"></span><span class="me-sub">Online</span></span>
        </button>
        <div class="controls">
          <button class="icon-btn" id="mic-btn"></button>
          <button class="icon-btn" id="deaf-btn"></button>
          <button class="icon-btn" id="settings-btn" title="Configurações de áudio e vídeo" aria-label="Configurações de áudio e vídeo"></button>
        </div>
      </footer>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn side-toggle" id="side-toggle" aria-label="Mostrar canais">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span id="top-icon" class="hash">#</span>
        <span id="top-title" class="top-title">chat</span>
        <span id="top-sub" class="top-sub"></span>
        <span class="spacer"></span>
        <button class="icon-btn" id="members-toggle" title="Membros" aria-label="Mostrar ou esconder membros">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>
        </button>
      </header>

      <div class="main-body">
        <section id="chat-view" class="chat-view">
          <div id="messages" class="messages" aria-live="polite"></div>
          <form id="chat-form" class="chat-form">
            <div id="mention-pop" class="mention-pop" role="listbox" aria-label="Mencionar alguém" hidden></div>
            <div id="attach-preview" class="attach-preview" hidden></div>
            <div class="composer" id="composer">
              <button type="button" class="icon-btn" id="attach-btn" title="Enviar imagem ou GIF" aria-label="Enviar imagem ou GIF">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
              </button>
              <label for="chat-input" class="sr-only">Mensagem</label>
              <textarea id="chat-input" rows="1" maxlength="2000" placeholder="Conversar em #chat" aria-autocomplete="list" aria-controls="mention-pop"></textarea>
              <button type="button" class="icon-btn" id="draw-btn" title="Sorteios (times, pessoas, dado, moeda…)" aria-label="Sorteios">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01"/></svg>
              </button>
              <button type="button" class="icon-btn" id="emoji-btn" title="Emojis" aria-label="Emojis">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
              </button>
              <input type="file" id="attach-input" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            </div>
          </form>
        </section>

        <section id="updates-view" class="updates-view" hidden>
          <div id="updates-list" class="updates-list"></div>
        </section>

        <section id="call-view" class="call-view" hidden>
          <div id="stage" class="stage"></div>
          <div id="call-empty" class="call-empty" hidden>
            <h2>Call da sala</h2>
            <p class="muted" id="call-empty-sub">Ninguém na call ainda.</p>
            <button class="btn primary" id="join-call-btn">Entrar na call</button>
          </div>
          <div class="stage-bar" id="stage-bar" hidden>
            <button class="round" id="mic-btn-2"></button>
            <button class="round" id="cam-btn-2"></button>
            <button class="round" id="screen-btn-2"></button>
            <button class="round danger" id="hangup-btn-2" aria-label="Sair da call" title="Sair da call"></button>
          </div>
          <button id="audio-unlock" class="audio-unlock" hidden>Clique para ativar o som da call</button>
        </section>

        <aside id="members-panel" class="members-panel"></aside>
      </div>
    </main>
  </div>

  <div id="menu-layer"></div>
  <div id="modal-layer"></div>
  <div id="toast" class="toast" role="status"></div>
  <div id="audio-bin" hidden></div>

  <script type="module" src="/dist/app.js"></script>
</body>
</html>
